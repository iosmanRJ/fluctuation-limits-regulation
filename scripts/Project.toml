# Charting environment. Kept separate from the core package so a headless
# machine can run simulations without OpenGL or any plotting stack.
#
#   julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
#   julia --project=scripts scripts/dashboard.jl runs/my-run
[deps]
